<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wagner Family Italy Trip — October 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;600;700&display=swap');

  :root {
    --rome: #C84B31;
    --rome-light: #FFF0EB;
    --lucca: #4A7C59;
    --lucca-light: #EBF5EE;
    --valdorcia: #8B6914;
    --valdorcia-light: #FFF8E7;
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --text-secondary: #666666;
    --border: #E8E5E0;
    --accent: #2D5F2D;
    --star: #D4A017;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    color: white;
    padding: 100px 40px 80px;
    text-align: center;
    overflow: hidden;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background: url('https://images.unsplash.com/photo-1515542622106-78bda8ba0e5b?w=1600&q=80') center/cover no-repeat;
    z-index: 0;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,20,15,0.45) 0%, rgba(30,25,15,0.7) 100%);
    z-index: 1;
  }
  .hero-content {
    position: relative;
    z-index: 2;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3.4em;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  .hero .subtitle {
    font-size: 1.25em;
    opacity: 0.95;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  .hero .dates {
    margin-top: 24px;
    display: inline-block;
    background: rgba(255,255,255,0.15);
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 0.95em;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* ===== ROUTE BAR ===== */
  .route-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0;
    padding: 30px 20px;
    background: white;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .route-stop {
    text-align: center;
    padding: 8px 18px;
  }
  .route-stop .city {
    font-weight: 700;
    font-size: 1em;
  }
  .route-stop .nights {
    font-size: 0.8em;
    color: var(--text-secondary);
  }
  .route-arrow {
    color: #CCC;
    font-size: 1.4em;
    padding: 0 4px;
  }
  .route-stop.rome .city { color: var(--rome); }
  .route-stop.lucca .city { color: var(--lucca); }
  .route-stop.valdorcia .city { color: var(--valdorcia); }

  .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
</style>
</head>
<body><h1>Italy Trip 2026</h1></body>
</html>
