<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wagner Family Italy Trip — October 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;600;700&display=swap');

  :root {
    --rome: #C84B31;
    --rome-light: #FFF0EB;
    --lucca: #4A7C59;
    --lucca-light: #EBF5EE;
    --valdorcia: #8B6914;
    --valdorcia-light: #FFF8E7;
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --text-secondary: #666666;
    --border: #E8E5E0;
    --accent: #2D5F2D;
    --star: #D4A017;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    color: white;
    padding: 100px 40px 80px;
    text-align: center;
    overflow: hidden;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background: url('https://images.unsplash.com/photo-1515542622106-78bda8ba0e5b?w=1600&q=80') center/cover no-repeat;
    z-index: 0;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,20,15,0.45) 0%, rgba(30,25,15,0.7) 100%);
    z-index: 1;
  }
  .hero-content {
    position: relative;
    z-index: 2;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3.4em;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  .hero .subtitle {
    font-size: 1.25em;
    opacity: 0.95;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  .hero .dates {
    margin-top: 24px;
    display: inline-block;
    background: rgba(255,255,255,0.15);
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 0.95em;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* ===== ROUTE BAR ===== */
  .route-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0;
    padding: 30px 20px;
    background: white;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .route-stop {
    text-align: center;
    padding: 8px 18px;
  }
  .route-stop .city {
    font-weight: 700;
    font-size: 1em;
  }
  .route-stop .nights {
    font-size: 0.8em;
    color: var(--text-secondary);
  }
  .route-arrow {
    color: #CCC;
    font-size: 1.4em;
    padding: 0 4px;
  }
  .route-stop.rome .city { color: var(--rome); }
  .route-stop.lucca .city { color: var(--lucca); }
  .route-stop.valdorcia .city { color: var(--valdorcia); }

  .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

  /* ===== SECTION HERO IMAGES ===== */
  .section-hero {
    width: 100%;
    max-width: 900px;
    margin: 40px auto 0;
    padding: 0 20px;
  }
  .section-hero-img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    border-radius: 16px 16px 0 0;
    display: block;
  }
  .section-hero-img.bottom-rounded {
    border-radius: 16px;
  }

  /* ===== LEG SECTIONS ===== */
  .leg-section {
    margin: 0 auto 40px;
    max-width: 900px;
    padding: 0 20px;
  }
  .leg-section.has-hero {
    margin-top: 0;
  }

  .leg-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    padding: 24px 0 14px;
    border-bottom: 3px solid var(--border);
  }
  .leg-header .leg-badge {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4em;
    flex-shrink: 0;
  }
  .leg-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8em;
    font-weight: 600;
  }
  .leg-header .leg-dates {
    font-size: 0.85em;
    color: var(--text-secondary);
    margin-left: auto;
    white-space: nowrap;
  }

  .rome-section .leg-header { border-color: var(--rome); }
  .rome-section .leg-badge { background: var(--rome-light); }
  .lucca-section .leg-header { border-color: var(--lucca); }
  .lucca-section .leg-badge { background: var(--lucca-light); }
  .valdorcia-section .leg-header { border-color: var(--valdorcia); }
  .valdorcia-section .leg-badge { background: var(--valdorcia-light); }

  .section-label {
    font-size: 0.75em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
    padding: 6px 12px;
    border-radius: 4px;
    display: inline-block;
  }
  .rome-section .section-label { color: var(--rome); background: var(--rome-light); }
  .lucca-section .section-label { color: var(--lucca); background: var(--lucca-light); }
  .valdorcia-section .section-label { color: var(--valdorcia); background: var(--valdorcia-light); }

  /* ===== ACCOMMODATION CARDS ===== */
  .accom-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-bottom: 30px;
  }

  .accom-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow 0.2s;
    position: relative;
    display: flex;
    flex-direction: row;
  }
  .accom-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .accom-card.recommended { border-left: 4px solid var(--accent); }

  .accom-thumb {
    width: 200px;
    min-height: 200px;
    flex-shrink: 0;
    object-fit: cover;
    display: block;
  }
  @media (max-width: 700px) {
    .accom-card { flex-direction: column; }
    .accom-thumb { width: 100%; height: 180px; min-height: auto; }
  }

  .accom-body {
    padding: 24px;
    flex: 1;
    position: relative;
  }

  .card-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 0.7em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .badge-pick { background: #E8F5E9; color: #2E7D32; }
  .badge-value { background: #E3F2FD; color: #1565C0; }
  .badge-design { background: #F3E5F5; color: #7B1FA2; }
  .badge-splurge { background: #FFF3E0; color: #E65100; }
  .badge-hotel { background: #ECEFF1; color: #455A64; }

  .card-type {
    font-size: 0.7em;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25em;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card-title a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .card-title a:hover { border-bottom-color: var(--text); }
  .card-meta {
    font-size: 0.85em;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .card-meta .stars { color: var(--star); }
  .card-desc {
    font-size: 0.9em;
    line-height: 1.65;
    margin-bottom: 12px;
  }
  .card-details {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .detail-pill {
    font-size: 0.78em;
    background: #F5F5F0;
    padding: 4px 10px;
    border-radius: 20px;
    color: var(--text-secondary);
  }
  .card-price {
    font-weight: 700;
    font-size: 1.05em;
    color: var(--accent);
  }
  .card-links {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .card-links a {
    font-size: 0.8em;
    color: var(--accent);
    text-decoration: none;
    padding: 4px 12px;
    border: 1px solid var(--accent);
    border-radius: 20px;
    transition: all 0.2s;
  }
  .card-links a:hover {
    background: var(--accent);
    color: white;
  }

  .advisor-note {
    background: #F9F7F4;
    border-left: 3px solid var(--accent);
    padding: 16px 20px;
    margin: 20px 0 30px;
    border-radius: 0 8px 8px 0;
    font-size: 0.9em;
    font-style: italic;
    color: #444;
  }

  /* ===== DAY CARDS ===== */
  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .day-header {
    padding: 16px 24px;
    font-weight: 700;
    font-size: 1em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }
  .day-header:hover { background: #FAFAF7; }
  .day-header .toggle { font-size: 0.8em; color: #999; transition: transform 0.2s; }
  .day-header .toggle.open { transform: rotate(180deg); }
  .day-content {
    padding: 0 24px 20px;
    display: none;
  }
  .day-content.open { display: block; }

  /* ===== DAY HIGHLIGHT IMAGES ===== */
  .day-highlights {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .day-highlights img {
    width: 160px;
    height: 110px;
    object-fit: cover;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .time-block {
    margin-bottom: 16px;
  }
  .time-block:last-child { margin-bottom: 0; }
  .time-label {
    font-size: 0.72em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .time-block p {
    font-size: 0.9em;
    line-height: 1.65;
    margin-bottom: 6px;
  }
  .time-block a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent);
  }
  .time-block a:hover { border-bottom-style: solid; }

  /* ===== LOGISTICS ===== */
  .logistics-section {
    margin: 40px auto;
    max-width: 900px;
    padding: 0 20px;
  }
  .logistics-section h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6em;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }

  .info-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .info-card h3 {
    font-size: 0.95em;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .info-card p, .info-card li {
    font-size: 0.85em;
    line-height: 1.6;
    color: var(--text-secondary);
  }
  .info-card ul { list-style: none; padding: 0; }
  .info-card li { padding: 4px 0; padding-left: 16px; position: relative; }
  .info-card li::before { content: ""; position: absolute; left: 0; top: 12px; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
  .info-card a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  .info-card a:hover { border-bottom-style: solid; }

  .budget-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88em;
    margin: 16px 0;
  }
  .budget-table th {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 2px solid var(--border);
    font-weight: 700;
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }
  .budget-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #F0EDE8;
  }
  .budget-table tr:last-child td {
    font-weight: 700;
    border-bottom: 2px solid var(--border);
    font-size: 1.05em;
  }
  .budget-table .notes { color: var(--text-secondary); font-size: 0.9em; }

  .checklist {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .checklist h3 {
    font-size: 0.95em;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--accent);
  }
  .checklist label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0;
    font-size: 0.88em;
    cursor: pointer;
    line-height: 1.5;
  }
  .checklist input[type="checkbox"] {
